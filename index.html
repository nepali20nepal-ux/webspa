<!DOCTYPE html>
<html lang="en">
<head>

  <title>The Magical Hands | Massage Parlor</title>
  <link rel="stylesheet" href="./style.css">
  
</head>
<body>

  <header class="navbar" id="navbar">

    <div class="brand">
  <img src="logo.png" alt="The Magical Hands logo" class="logo-img" />
  <span class="logo-text">The Magical Hands</span>
</div>
   
    <nav>
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  
 <!-- paintfill -->
  <div class="color-fill" id="colorFill"></div>




  <section class="hero-coverflow" id="home">
  <div class="hero-fill" id="heroFill"></div>

  <h2 class="hero-title fade-up delay-1">Relax. Refresh. Rejuvenate.</h2>
<p class="hero-sub fade-up delay-2">Find your calm at The Magical Hands Massage Parlor.</p>


    <div class="coverflow fade-up delay-3">
      <button class="arrow left" id="prev" aria-label="Previous">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

      <div class="cards" id="carousel">
        <div class="card" style="background-image:url('spa.jpg')"></div>
        <div class="card" style="background-image:url('candle.webp')"></div>
        <div class="card" style="background-image:url('bed.jpg.webp')"></div>
        <div class="card" style="background-image:url('room.png')"></div>
      </div>

      <button class="arrow right" id="next" aria-label="Next">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
</div>

</section>

  <section class="services" id="services">
    <h2>Our Services</h2>
    <div class="service-cards">
  <div class="card fade-up delay-3">Full Body Massage</div>
  <div class="card fade-up delay-6">Aromatherapy</div>
  <div class="card fade-up delay-8">Head & Shoulder</div>
</div>

  </section>

  <section class="contact" id="contact">
    <h2>Visit Us</h2>
    <p>📍 Main Road, Your City</p>
    <p>⏰ 10 AM – 8 PM</p>
    <p>📞 +977-98XXXXXXXX</p>
  </section>

  <footer>
    <p>© 2026 The Magical Hands Massage Parlor</p>
  </footer>

  <script src="./slider.js"></script>
</body>
</html>
